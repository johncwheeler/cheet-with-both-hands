# Tests and builds the app on every push and pull request, and uploads the zipped app as a
# downloadable artifact. Pushing a version tag (v1.2.0) also attaches the zip to that tag's GitHub
# Release, creating the release if it doesn't exist yet. To attach a build to an existing release
# after the fact, run this workflow by hand (Actions › Build › Run workflow) and enter its tag.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the zip to (e.g. v1.2.0). Leave empty for a plain build."
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # publishing release assets
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; fi
          if [[ -n "$INPUT_TAG" ]]; then tag="$INPUT_TAG"; fi
          if [[ -n "$tag" && ! "$tag" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::'$tag' isn't a version tag like v1.2.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A manual run for a release tag builds that tag's code.
          ref: ${{ steps.release.outputs.tag || github.ref }}

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: make test

      - name: Build and package (universal)
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [[ -n "$TAG" ]]; then export VERSION="${TAG#v}"; fi
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          make dist

      # upload-artifact zips whatever it's given, and a raw .app would lose its executable bit and
      # signature, so it uploads the ditto-made zip (the download is a zip containing that zip).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheet-with-Both-Hands
          path: build/Cheet-with-Both-Hands.zip
          if-no-files-found: error

      # Works whether the release was made here or in the GitHub UI first: it creates the release
      # if needed, otherwise uploads to it (replacing an earlier copy of the zip).
      - name: Attach to release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          asset="build/Cheet-with-Both-Hands-$TAG.zip"
          cp build/Cheet-with-Both-Hands.zip "$asset"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$asset" --clobber
          else
            gh release create "$TAG" "$asset" --verify-tag --title "Cheet with Both Hands $TAG" --generate-notes
          fi
