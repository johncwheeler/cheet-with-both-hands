# Tests and builds the app on every push and pull request, and uploads the zipped app as a
# downloadable artifact. Pushing a version tag (v1.2.0) also publishes a GitHub Release with the zip.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write # publishing releases for version tags
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: make test

      - name: Build and package (universal)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER"
          make dist

      # upload-artifact zips whatever it's given, and a raw .app would lose its executable bit and
      # signature, so it uploads the ditto-made zip (the download is a zip containing that zip).
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheet-with-Both-Hands
          path: build/Cheet-with-Both-Hands.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Cheet-with-Both-Hands.zip \
            --title "Cheet with Both Hands $GITHUB_REF_NAME" \
            --generate-notes
